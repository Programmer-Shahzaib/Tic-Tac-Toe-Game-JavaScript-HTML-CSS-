<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="Count">
        <div id="player1">
            <h4>Player1</h4>
            <p id="p1"></p>
        </div>
        <div id="player2">
            <h4>Player2</h4>
            <p id="p2"></p>
        </div>
    </div>
    <main>
      <div id="message-container">
        <p id="msg">Winner</p>
        <button id="new-button">New Game</button>
      </div>
      <h1>Tic Tac Toe</h1>
      <div id="container">
        <div id="game">
          <button class="box"></button>
          <button class="box"></button>
          <button class ="box"></button>
          <button class ="box"></button>
          <button class ="box"></button>
          <button class ="box"></button>
          <button class ="box"></button>
          <button class ="box"></button>
          <button class ="box"></button>
        </div>
      </div>
      <button id="reset-button">Restart</button>
    </main>
    <script src="script.js"></script>
  </body>
</html>
